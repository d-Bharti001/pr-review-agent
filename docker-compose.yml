x-app: &app
  build: .
  image: pr-review-agent:1.0.0
  restart: unless-stopped
  env_file: .env
  # Overriding env variables: inside the compose network the services use their own names
  environment:
    NODE_ENV: production
    PORT: 8081
    MYSQL_HOST: mysql
    MYSQL_PORT: 3306
    REDIS_HOST: redis
    REDIS_PORT: 6379
    GITHUB_PRIVATE_KEY_PATH: /app/secrets/private-key.pem
  volumes:
    - ./secrets:/app/secrets:ro

services:
  mysql:
    image: mysql:8.4
    container_name: pr_review_agent_database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pr_review
      MYSQL_USER: pr_review_user
      MYSQL_PASSWORD: pr_review_password
    ports:
      - "127.0.0.1:8082:3306"
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: pr_review_agent_redis
    command: ["redis-server", "--appendonly", "yes"] # Append-only file: queued and active jobs survive a Redis restart
    ports:
      - "127.0.0.1:8083:6379"
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "node_modules/.bin/db-migrate", "up"]
    depends_on:
      mysql:
        condition: service_healthy

  server:
    <<: *app
    command: ["node", "build/src/server.js"]
    ports:
      - "127.0.0.1:8081:8081"
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *app
    command: ["node", "build/src/worker.js"]
    stop_grace_period: 6m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
